<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notes · Campus Unified</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/notes.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="app-body">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand"><i class="fa-solid fa-graduation-cap"></i><span>Campus<b>Unified</b></span></div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Dashboard</span></a>
      <a href="attendance.html" class="nav-item"><i class="fa-solid fa-calendar-check"></i><span>Attendance</span></a>
      <a href="results.html" class="nav-item"><i class="fa-solid fa-chart-bar"></i><span>Results</span></a>
      <a href="approvals.html" class="nav-item"><i class="fa-solid fa-file-signature"></i><span>Approvals</span></a>
      <a href="notes.html" class="nav-item active"><i class="fa-solid fa-book-open"></i><span>Notes</span></a>
      <a href="events.html" class="nav-item"><i class="fa-solid fa-calendar-star"></i><span>Events</span></a>
      <a href="calendar.html" class="nav-item"><i class="fa-solid fa-calendar-days"></i><span>Calendar</span></a>
    </nav>
    <div class="sidebar-footer"><button class="logout-btn" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></button></div>
  </aside>
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

  <main class="main-content">
    <header class="topnav">
      <button class="hamburger" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
      <div class="topnav-title">Notes</div>
      <div class="topnav-right">
        <div class="notif-btn"><i class="fa-solid fa-bell"></i><span class="notif-dot"></span></div>
        <div class="avatar-mini" id="avatarMini">--</div>
      </div>
    </header>

    <div class="page-content">

      <!-- Breadcrumb -->
      <div class="notes-breadcrumb" id="notesBreadcrumb">
        <span class="bc-item active">Subjects</span>
      </div>

      <!-- Step 1: Subject List -->
      <div id="notesStep1">
        <div class="greeting-row">
          <div><h2 class="greeting-text">Study Notes</h2><p class="greeting-sub">Select a subject to explore</p></div>
        </div>
        <div class="subjects-grid" id="subjectsGrid"></div>
      </div>

      <!-- Step 2: Units List -->
      <div id="notesStep2" class="hidden">
        <div class="back-row">
          <button class="back-btn" onclick="notesGoBack(1)"><i class="fa-solid fa-arrow-left"></i> Back</button>
          <h3 class="section-title" id="selectedSubjectName"></h3>
        </div>
        <div class="units-grid" id="unitsGrid"></div>
      </div>

      <!-- Step 3: Notes Content -->
      <div id="notesStep3" class="hidden">
        <div class="back-row">
          <button class="back-btn" onclick="notesGoBack(2)"><i class="fa-solid fa-arrow-left"></i> Back</button>
          <h3 class="section-title" id="selectedUnitName"></h3>
        </div>
        <div class="notes-content-area" id="notesContentArea"></div>
      </div>

    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/notes.js"></script>
</body>
</html>
